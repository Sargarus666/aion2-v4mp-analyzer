name: Daily site monitor

on:
  push:
    branches: [main]
  schedule:
    # Daily at 09:00 Moscow time (UTC+3).
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-site-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Tests, build and production smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Check production website
        env:
          PRODUCTION_URL: https://aion2-v4mp-analyzer.pages.dev/
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/production-homepage.html"
          http_code="$(curl --location --silent --show-error --output "$response_file" --write-out '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors --max-time 45 "$PRODUCTION_URL")"
          echo "Production HTTP status: $http_code"
          test "$http_code" = "200"
          grep -Fq 'AION 2 Build Lab' "$response_file"
          grep -Fq 'id="root"' "$response_file"
          echo "Production homepage returned HTTP 200 and contains the expected app shell."
