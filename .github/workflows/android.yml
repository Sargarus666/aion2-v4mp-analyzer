name: Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
        working-directory: android
      - name: Android lint
        run: gradle :app:lintDebug
        working-directory: android
      - name: Build debug APK
        run: gradle :app:assembleDebug
        working-directory: android
      - name: Build optimized release APK
        run: gradle :app:assembleRelease
        working-directory: android
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aion2-build-lab-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.2.0
          name: AION 2 Build Lab — latest Android APK
          body: |
            Version: 0.2.0
            Installable debug-signed APK for testing. The optimized release build is currently unsigned.
            Build commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
