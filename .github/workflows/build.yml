name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly full-history secret scan
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Diagnose live NCSOFT profile payload (non-blocking)
        run: node scripts/diagnose-live-profile.mjs
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - run: node --check functions/api/profile.js
      - run: node --check functions/api/daevanion.js
      - run: node --check functions/api/equipment-item.js
      - run: node --check src/lib/character-data.js
      - run: node --check src/lib/profile-state.js
      - run: node --check src/lib/game-localization.js
      - run: npm audit

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
