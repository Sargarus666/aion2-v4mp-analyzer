name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Diagnose live NCSOFT profile payload (non-blocking)\n        run: node scripts/diagnose-live-profile.mjs\n        continue-on-error: true\n      - run: npm test
      - run: npm run build
      - run: node --check functions/api/profile.js
      - run: node --check src/lib/character-data.js
      - run: npm audit
